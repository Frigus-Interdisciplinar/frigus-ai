name: Deploy

# Roda só depois do CI passar na main (ou manualmente). Só faz o deploy: o token de deploy do
# FastAPI Cloud não gerencia env vars (`fastapi cloud env set` exige login de usuário), então as
# envs de produção são aplicadas à mão (dashboard ou `fastapi cloud env set`), com o Infisical
# como fonte.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      FASTAPI_CLOUD_TOKEN: ${{ secrets.FASTAPI_CLOUD_TOKEN }}
      FASTAPI_CLOUD_APP_ID: ${{ secrets.FASTAPI_CLOUD_APP_ID }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          version: "0.11.16"

      - name: Instalar dependências
        run: uv sync --locked

      - name: Deploy
        run: uv run fastapi deploy
