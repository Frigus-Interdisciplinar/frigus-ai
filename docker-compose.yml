services:
  postgres:
    image: postgres:16-alpine
    container_name: frigus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: frigus
      POSTGRES_PASSWORD: frigus
      POSTGRES_DB: frigus
    ports:
      - "5432:5432"
    volumes:
      - frigus_postgres_data:/var/lib/postgresql/data
      - ./data/sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U frigus -d frigus"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    container_name: frigus_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - frigus_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: frigus_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - frigus_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5-community
    container_name: frigus_neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/frigus123
    ports:
      - "7474:7474" # console web (http://localhost:7474)
      - "7687:7687" # bolt (usado pelo neomodel)
    volumes:
      - frigus_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: frigus_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - frigus_qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:v3.0.1
    container_name: frigus_prometheus
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway" # já nativo no Docker Desktop; necessário no Linux
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - frigus_prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.4.0
    container_name: frigus_grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - frigus_grafana_data:/var/lib/grafana

volumes:
  frigus_postgres_data:
  frigus_mongo_data:
  frigus_redis_data:
  frigus_neo4j_data:
  frigus_qdrant_data:
  frigus_prometheus_data:
  frigus_grafana_data:
