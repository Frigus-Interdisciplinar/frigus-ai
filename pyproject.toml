[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "frigus-ai"
version = "0.1.0"
description = "Chatbot multi-agente do Frigus — gestão de alimentos, receitas, compras e finanças domésticas (LangGraph + RAG)."
requires-python = ">=3.13,<3.14"
dependencies = [
    # LLM / agentes / grafo
    "langchain>=1.2",
    "langchain-core>=1.4",
    "langchain-anthropic>=1.4",
    "langchain-google-genai>=4.2",
    "langchain-groq>=1.1",
    "langchain-community>=0.4",
    "langchain-text-splitters>=1.1",
    "langgraph>=1.1",
    "langgraph-checkpoint-mongodb>=0.4",

    # RAG (FAQ)
    "faiss-cpu>=1.14",
    "pypdf>=6.0",

    # Persistência
    "psycopg2-binary>=2.9",
    "pymongo>=4.12,<4.17",

    # Config / utilitários
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "rich>=15.0",
    "pyfiglet>=1.0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["config", "interfaces", "src/frigus_ai"]

[tool.ruff]
target-version = "py313"

[tool.ruff.lint]
# BLE001: cada tool precisa capturar Exception genérica e devolver Response.error —
#   deixar a exception escapar quebra o turno inteiro (ver AGENTS.md).
# SIM117: `with get_conn() as conn:` + `with conn.cursor() as cur:` aninhados são
#   mais legíveis que a forma combinada, e é o padrão em todo tools/postgres.
# DTZ011: `date.today()` é intencional — as datas de validade/estoque são locais,
#   sem hora, e o semáforo compara dia a dia (ver TODO.md sobre revisar timezone).
ignore = ["BLE001", "SIM117", "DTZ011"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
]
